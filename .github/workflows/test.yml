name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # Captions and titles are drawn with macOS AppKit (src/ffmpeg.js), and the tests render them.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: brew install ffmpeg
      - run: npm test
